[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-tracker"
version = "0.3.0"
description = "Measure how often LLM answer engines cite your URLs and mention your brand."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "onblueroses" }]
keywords = ["geo", "aeo", "llm", "seo", "openrouter", "bedrock", "perplexity", "answer-engines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "openai>=3.0",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.44"]  # 1.44 is the tested version, not a measured minimum
dev = ["pytest>=8", "boto3>=1.44"]

[project.scripts]
geo-tracker = "geo_tracker.cli:main"

[project.urls]
Repository = "https://github.com/onblueroses/geo-tracker"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["geo_tracker*"]
