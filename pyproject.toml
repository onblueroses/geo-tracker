[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-tracker"
version = "0.1.0"
description = "Measure how often LLM answer engines cite your URLs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "onblueroses" }]
keywords = ["geo", "aeo", "llm", "seo", "openrouter", "perplexity", "answer-engines"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geo-tracker = "geo_tracker.cli:main"

[project.urls]
Repository = "https://github.com/onblueroses/geo-tracker"

[tool.setuptools.packages.find]
include = ["geo_tracker*"]
